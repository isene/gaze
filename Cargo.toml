[package]
name = "gaze"
version = "0.1.0"
edition = "2021"
description = "Looking out onto the web: a keyboard-driven browser around WebKitGTK"
license = "Unlicense"
repository = "https://github.com/isene/gaze"
authors = ["Geir Isene <g@isene.com>"]

[dependencies]
gtk4 = { version = "0.11", features = ["v4_12"] }
webkit6 = "0.6"
javascriptcore6 = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
argon2 = "0.5"
chacha20poly1305 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
