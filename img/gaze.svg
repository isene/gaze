<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="disc" cx="50%" cy="50%" r="55%">
      <stop offset="0%"  style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#06051a"/>
    </radialGradient>
    <linearGradient id="rust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  style="stop-color:#f74c00"/>
      <stop offset="100%" style="stop-color:#b7410e"/>
    </linearGradient>
    <radialGradient id="iris" cx="45%" cy="40%" r="60%">
      <stop offset="0%"  style="stop-color:#ffb070"/>
      <stop offset="55%" style="stop-color:#f74c00"/>
      <stop offset="100%" style="stop-color:#7a2a08"/>
    </radialGradient>
  </defs>

  <!-- Disc with rust-orange ring, as the suite draws it -->
  <circle cx="128" cy="128" r="120" fill="url(#disc)" stroke="url(#rust)" stroke-width="3"/>

  <!-- A window to look out of: faint frame and bars -->
  <rect x="58" y="70" width="140" height="116" rx="6" fill="none" stroke="#f74c00" stroke-width="1.2" opacity="0.28"/>
  <line x1="128" y1="70" x2="128" y2="186" stroke="#f74c00" stroke-width="1" opacity="0.22"/>
  <line x1="58" y1="128" x2="198" y2="128" stroke="#f74c00" stroke-width="1" opacity="0.22"/>

  <!-- The eye, looking out -->
  <path d="M72 128 Q128 78 184 128 Q128 178 72 128 Z" fill="#f4ead8" stroke="url(#rust)" stroke-width="2.5"/>
  <circle cx="128" cy="128" r="26" fill="url(#iris)"/>
  <circle cx="128" cy="128" r="11" fill="#0a0a14"/>
  <circle cx="137" cy="119" r="5" fill="#ffffff"/>

  <!-- wordmark -->
  <text x="128" y="232" font-family="monospace" font-size="22" font-weight="bold" fill="url(#rust)" text-anchor="middle" letter-spacing="6">gaze</text>
</svg>
